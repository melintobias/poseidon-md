[project]
name = "poseidon-md"
version = "0.1.0"
description = "Poseidon-MD: An end-to-end audio acquisition tool that extracts audio from online sources, resolves metadata, and outputs properly tagged files in MP3 and more."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["cli", "core"]

[tool.ruff]
preview = true
fix = true
exclude = ["third-party"]
line-length = 80

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint]
preview = true
dummy-variable-rgx = "^\\*{0,2}(_$|unused_|dummy_)"
logger-objects = ["logging", "absl.logging", "tensorflow.io.logging"]
# TODO: Go through Ruff's list of rules and decide which ones to enable/disable
select = [
	"YTT",
	"ANN",
	"ASYNC",
	"S",
	"BLE",
	"FBT",
	"B",
	"A",
	"COM",
	"C4",
	"CPY",
	"DTZ",
	"T10",
	"EM",
	"FA",
	"ISC",
	"ICN",
	"LOG",
	"G",
	"INP",
	"PIE",
	"T20",
	"PYI",
	"RSE",
	"RET",
	"SLF",
	"SIM",
	"SLOT",
	"TID",
	"TC",
	"ARG",
	"PTH",
	"FLY",
	"I",
	"C90",
	"N",
	"PERF",
	"E",
	"W",
	"DOC",
	"D",
	"F",
	"PL",
	"UP",
	"FURB",
	"RUF",
	"TRY",
]
ignore = [
	"CPY001", # missing-copyright-notice
	"DOC502", # docstring-extraneous-exception
	"EM101",  # raw-string-in-exception
	"TRY003", # raise-vanilla-args
]

[tool.ruff.lint.isort]
# Reference: https://pycqa.github.io/isort/docs/configuration/options.html#profile
# This follows the `isort` profile for `google`.
# Ruff's implementation of isort does not currently include the following
# settings from the `google` profile:
# profile = "google"
# lexicographical = true
# line-length = 1000
# group-by-package = true
force-single-line = true
force-sort-within-sections = true
known-third-party = ["enchant", "absl"]
single-line-exclusions = ["collections.abc", "typing"]
order-by-type = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = ["prek>=0.3.13", "ruff>=0.15.12", "ty>=0.0.65"]
