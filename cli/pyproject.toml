[project]
name = "posidon-cli"
version = "0.1.0"
description = "The command-line interface for Posidon."
requires-python = ">=3.14"
dependencies = [
	"posidon-core",
	"pydantic>=2.13.4",
	"rich>=15.0.0",
	"typer>=0.27.1",
	"yt-dlp>=2026.8.19",
]

[tool.uv.sources]
posidon-core = { workspace = true }

[project.scripts]
posidon = "posidon_cli.main:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
